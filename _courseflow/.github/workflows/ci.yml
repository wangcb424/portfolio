name: CourseFlow CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: courseflow_test
          POSTGRES_USER: courseflow
          POSTGRES_PASSWORD: ci-only-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U courseflow -d courseflow_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: frontend
      - run: mkdir -p backend/src/main/resources/static && cp -R frontend/dist/. backend/src/main/resources/static/
      - run: sh ./mvnw -B -ntp verify
        working-directory: backend
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/courseflow_test
          TEST_DB_USER: courseflow
          TEST_DB_PASSWORD: ci-only-password
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with: {name: courseflow-app, path: backend/target/courseflow-0.2.0.jar}
