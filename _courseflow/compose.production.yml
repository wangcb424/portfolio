# Run behind an HTTPS reverse proxy. Never scale the app above one replica in v0.2.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: courseflow
      POSTGRES_USER: courseflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes: ["courseflow-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U courseflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server","--maxmemory","64mb","--maxmemory-policy","allkeys-lru"]
    restart: unless-stopped
  app:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: production
      DB_URL: jdbc:postgresql://db:5432/courseflow
      DB_USER: courseflow
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      REDIS_ENABLED: 'true'
      REDIS_URL: redis://redis:6379
      COOKIE_SECURE: 'true'
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    restart: unless-stopped
volumes:
  courseflow-postgres:
