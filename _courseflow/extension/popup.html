<!doctype html><html lang="en"><head><meta charset="utf-8"/><title>CourseFlow</title><link rel="stylesheet" href="popup.css"/></head><body><h1>CourseFlow<span>.</span></h1><p>Quick access to your course tracker.</p><form id="open"><label>Your CourseFlow website<input id="site" type="url" placeholder="https://your-courseflow.example" required/></label><label>Course code<input id="course" placeholder="CS3100" required maxlength="12"/></label><label>Term code (optional)<input id="term" placeholder="Choose in the app" pattern="[0-9]{6}" maxlength="6"/></label><button>Open tracker ↗</button></form><p id="error" role="alert"></p><small>Select a course code on a Banner page before opening this popup to prefill it. Monitoring runs on your CourseFlow server.</small><script src="popup.js"></script></body></html>
