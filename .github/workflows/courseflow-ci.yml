name: CourseFlow verification
on:
  push:
    paths: ['_courseflow/**', '.github/workflows/courseflow-ci.yml']
  pull_request:
    paths: ['_courseflow/**', '.github/workflows/courseflow-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: courseflow-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: courseflow_test
          POSTGRES_USER: courseflow
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U courseflow -d courseflow_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: _courseflow/backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: _courseflow/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: _courseflow/frontend
      - run: mkdir -p _courseflow/backend/src/main/resources/static && cp -R _courseflow/frontend/dist/. _courseflow/backend/src/main/resources/static/
      - run: sh ./mvnw -B -ntp verify
        working-directory: _courseflow/backend
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/courseflow_test
          TEST_DB_USER: courseflow
          TEST_DB_PASSWORD: ci-only-password
      - run: npx playwright install --with-deps chromium
        working-directory: _courseflow/frontend
      - run: npm run test:e2e
        working-directory: _courseflow/frontend
      - run: npm run test:ui && npm run test:pages && npm run test:free
        working-directory: _courseflow/frontend
      - run: npm test
        working-directory: _courseflow/public-query-proxy
      - uses: actions/upload-artifact@v4
        with:
          name: courseflow-java-demo
          path: _courseflow/backend/target/courseflow-0.2.0.jar
          retention-days: 7
